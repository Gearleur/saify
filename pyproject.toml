[project]
name = "saify"
version = "0.3.0"
description = "Orsay Gestion : rapprochement quotidien des positions titres et questions sur la base de gestion"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "python-dotenv",
    # LLM (compréhension des questions, besoin 2)
    "anthropic",
    # lecture des fichiers Excel du client
    "openpyxl",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "httpx",
    "pyright>=1.1.414",
]  # httpx : client de test FastAPI
exploration = ["pandas>=3.0.6"]  # notebook exploration/Visual.ipynb uniquement

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Le formateur coupe le code à 100 ; les chaînes et commentaires qu'il ne coupe pas ont une limite dure à 120.
[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.pyright]
include = ["middle_office", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
