[project]
name = "saify"
version = "0.3.0"
description = "Orsay Gestion : rapprochement quotidien des positions titres et questions sur la base de gestion"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "python-dotenv",
    # LLM (compréhension des questions, besoin 2)
    "anthropic",
    # lecture des fichiers Excel du client
    "openpyxl",
]

[dependency-groups]
dev = ["pytest", "ruff", "httpx"]  # httpx : client de test FastAPI
exploration = ["pandas>=3.0.6"]  # notebook exploration/Visual.ipynb uniquement

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
